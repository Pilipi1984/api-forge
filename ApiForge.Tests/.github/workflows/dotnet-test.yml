name: .NET Tests

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Restore
      run: dotnet restore ApiForge.sln
    - name: Build
      run: dotnet build ApiForge.sln --configuration Release --no-restore
    - name: Run tests (with coverage)
      run: |
        dotnet test ApiForge.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Upload test results and coverage
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          **/TestResults/**
          **/coverage.cobertura.xml
